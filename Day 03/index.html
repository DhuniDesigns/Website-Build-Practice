<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WEME — Give your ideas a glow up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="page">
    <header class="site-header">
      <a class="logo" href="#">
        <img src="assets/logo.svg" alt="WEME" />
      </a>

      <button class="cta-btn cta-btn--desktop">
        <img src="assets/button.svg" alt="Book Your Free Intro Call" />
      </button>
      <button class="cta-btn cta-btn--mobile" aria-label="Open menu"><span class="menu-pill">MENU</span></button>
    </header>

    <main class="hero">
      <h1 class="hero-title">
        Give Your ideas a glow up.<br class="br-desktop" />
        Meet your new AI creative<br class="br-desktop" />
        <span class="highlight">collaborator.</span>
      </h1>

      <p class="hero-subtitle">Capture, organize, and elevate your ideas across<br class="br-desktop" /> work, life and leisure</p>

      <div class="card-stage">
        <img class="card card--green" src="assets/card-green.svg" alt="" />
        <img class="card card--red" src="assets/card-red.svg" alt="" />
        <img class="card card--orange" src="assets/card-orange.svg" alt="" />
        <img class="card card--blue" src="assets/card-blue.svg" alt="" />
        <img class="card card--dark" src="assets/card-dark.svg" alt="" />
        <img class="mascot" src="assets/mascot.svg" alt="" />
      </div>

      <ul class="logo-strip" aria-label="Trusted by">
        <li class="brand brand--github">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 0C5.37 0 0 5.373 0 12c0 5.303 3.438 9.8 8.207 11.387.6.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23a11.5 11.5 0 0 1 3.003-.404c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.91 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.565 21.796 24 17.303 24 12c0-6.627-5.373-12-12-12z"/></svg>
          <span>GitHub</span>
        </li>
        <li class="brand brand--vercel">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 1L24 22H0L12 1Z"/></svg>
          <span>Vercel</span>
        </li>
        <li class="brand brand--linkedin">
          <span>Linked</span>
          <span class="li-badge">in</span>
        </li>
        <li class="brand brand--cal">
          <span>Cal.com</span>
        </li>
      </ul>
    </main>
  </div>

</body>
</html>
