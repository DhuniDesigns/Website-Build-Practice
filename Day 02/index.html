<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Day 02 - Hero Section</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero-shell" aria-label="Creative video creation agency hero">
      <section class="hero-stage" data-node-id="71:116">
        <div class="blue-glow" aria-hidden="true">
          <img src="assets/hero-blue-glow.svg" alt="" />
        </div>

        <div class="bg-rough" aria-hidden="true">
          <div class="bg-rough-base"></div>
          <div class="bg-rough-texture"></div>
        </div>

        <img class="guide-dot dot-tl" src="assets/hero-dot.svg" alt="" aria-hidden="true" />
        <img class="guide-dot dot-tr" src="assets/hero-dot.svg" alt="" aria-hidden="true" />
        <img class="guide-dot dot-br" src="assets/hero-dot.svg" alt="" aria-hidden="true" />
        <img class="guide-dot dot-bl" src="assets/hero-dot.svg" alt="" aria-hidden="true" />
        <img class="guide-line guide-left" src="assets/hero-line-vertical.svg" alt="" aria-hidden="true" />
        <img class="guide-line guide-right" src="assets/hero-line-vertical.svg" alt="" aria-hidden="true" />
        <img class="guide-line guide-bottom" src="assets/hero-line-bottom.svg" alt="" aria-hidden="true" />
        <img class="guide-line guide-top" src="assets/hero-line-top.svg" alt="" aria-hidden="true" />
        <img class="bolt" src="assets/hero-bolt.svg" alt="" aria-hidden="true" />

        <div class="hero-images" aria-hidden="true" data-node-id="71:132">
          <div class="hero-card-set">
            <div class="hero-card card-1 hero-reveal" style="animation-delay: 260ms">
              <img src="assets/hero-card-1.png" alt="" />
            </div>
            <div class="hero-card card-2 hero-reveal" style="animation-delay: 200ms">
              <img src="assets/hero-card-2.png" alt="" />
            </div>
            <div class="hero-card card-3 hero-reveal" style="animation-delay: 140ms">
              <img src="assets/hero-card-3.png" alt="" />
            </div>
            <div class="hero-card card-4 hero-reveal" style="animation-delay: 80ms">
              <img src="assets/hero-card-4.png" alt="" />
            </div>
            <div class="hero-card card-5 hero-reveal" style="animation-delay: 140ms">
              <img src="assets/hero-card-5.png" alt="" />
            </div>
            <div class="hero-card card-6 hero-reveal" style="animation-delay: 200ms">
              <img src="assets/hero-card-6.png" alt="" />
            </div>
            <div class="hero-card card-7 hero-reveal" style="animation-delay: 260ms">
              <img src="assets/hero-card-7.png" alt="" />
            </div>
          </div>
        </div>

        <div class="hero-container" data-node-id="71:140">
          <div class="heading-block">
            <div class="headline-art hero-reveal" style="animation-delay: 0ms">
              <div class="headline-top">
                <span class="headline-a">A</span>
                <img class="creative-frame" src="assets/creative-frame.svg" alt="" aria-hidden="true" />
                <span class="headline-creative">Creative</span>
                <span class="headline-video">Video Creation Agency</span>
              </div>
              <div class="headline-bottom">That Drives Engagement</div>
            </div>
            <!-- Figma's mobile frame (node 71:79) breaks this headline across three
                 lines differently than desktop, so it gets its own markup rather than
                 trying to force desktop's line grouping to reflow. Only one of the two
                 is ever visible (display toggled by breakpoint), so nothing is
                 duplicated for assistive tech. -->
            <div class="headline-art-mobile hero-reveal" style="animation-delay: 0ms">
              <div class="mh-row1">
                <span class="mh-a">A</span>
                <span class="mh-creative">Creative</span>
                <span class="mh-video">Video</span>
              </div>
              <div class="mh-row2">Creation Agency</div>
              <div class="mh-row3">That drives engagement</div>
            </div>
            <p class="hero-reveal" style="animation-delay: 100ms">
              We enhance businesses' ability to boost customer engagement through the
              integration of personalized and interactive elements into their videos.
            </p>
          </div>
          <button type="button" class="hero-cta hero-reveal" style="animation-delay: 180ms">
            Generate Cards
          </button>
        </div>
      </section>
    </main>

    <script>
      const shell = document.querySelector(".hero-shell");
      const stage = document.querySelector(".hero-stage");

      // Desktop stage is a fixed 1440x1042 canvas from Figma node 71:116,
      // scaled to fit the viewport. Below 900px we swap to a second fixed
      // canvas — 390x873, matching Figma's dedicated Mobile frame (71:79) —
      // using the exact same scale-to-fit technique, rather than trying to
      // approximate the mobile layout by shrinking the desktop one.
      const MOBILE_BREAKPOINT = 900;
      const MOBILE_STAGE_WIDTH = 390;
      const MOBILE_STAGE_HEIGHT = 873;
      const DESKTOP_STAGE_WIDTH = 1440;
      const DESKTOP_STAGE_HEIGHT = 1042;

      function fitHero() {
        if (window.innerWidth <= MOBILE_BREAKPOINT) {
          const scale = window.innerWidth / MOBILE_STAGE_WIDTH;
          stage.style.setProperty("--hero-scale", scale.toString());
          shell.style.setProperty("--hero-height", `${MOBILE_STAGE_HEIGHT * scale}px`);
          return;
        }

        const scale = window.innerWidth / DESKTOP_STAGE_WIDTH;
        stage.style.setProperty("--hero-scale", scale.toString());
        shell.style.setProperty("--hero-height", `${DESKTOP_STAGE_HEIGHT * scale}px`);
      }

      fitHero();
      window.addEventListener("resize", fitHero);

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      // Once an entrance reveal finishes, drop the class entirely so the
      // animation stops "owning" transform/opacity. Otherwise the filled
      // end-state would keep overriding :hover/:active changes forever.
      document.querySelectorAll(".hero-reveal").forEach((el) => {
        el.addEventListener(
          "animationend",
          () => {
            el.classList.remove("hero-reveal");
            el.style.removeProperty("animation-delay");
          },
          { once: true }
        );
      });

      const ctaButton = document.querySelector(".hero-cta");
      const imageStage = document.querySelector(".hero-images");

      function shuffle(list) {
        const result = list.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      // Cylinder carousel — mechanics ported from the Vengeance UI
      // Cylinder Carousel reference (real perspective + tan()-based
      // radius + backface-visibility, no faked opacity/blur), with
      // drag-to-spin/inertia layered on top. Falls back to the static
      // Figma fan under prefers-reduced-motion.
      //
      // `carousel` is set to a small control object once the ring is
      // built, and back to null whenever the static fan is showing
      // (reduced motion). The "Generate Cards" handler below checks it
      // to decide whether to boost the spin or shuffle the static cards
      // — the carousel replaces the static card elements wholesale, so
      // anything holding onto the old nodes would be acting on detached
      // DOM otherwise.
      let carousel = null;

      function setupCardCarousel() {
        const baseSet = imageStage?.querySelector(".hero-card-set");
        if (!imageStage || !baseSet) return;

        const staticMarkup = baseSet.innerHTML;
        // The static Figma fan (hero-card-N.png) has the fan shape baked
        // directly into each PNG — irregular parallelogram crops with
        // transparent corners. That's correct for the static layout, but
        // wrapping those into rotating rectangular carousel panels was
        // the actual cause of the torn/broken edges: at grazing angles
        // near the mask, you'd see the image's own transparent skewed
        // corners inside what should read as a solid card. These
        // carousel-card-N assets are the same 7 source photos, but as
        // clean full rectangles — object-fit: cover handles framing them
        // into each panel instead of relying on a pre-baked crop shape.
        const imageSources = [
          "assets/carousel-card-1.png",
          "assets/carousel-card-2.png",
          "assets/carousel-card-3.png",
          "assets/carousel-card-4.png",
          "assets/carousel-card-5.png",
          "assets/carousel-card-6.png",
          "assets/carousel-card-7.png",
        ];
        // 3x repeat (21 panels, ~17.1° apart) rather than 2x (14 panels,
        // ~25.7° apart). This isn't just a density preference — the
        // edge fade band below needs at least one panel inside it at
        // all times, or you get a visible empty gap where one card has
        // finished fading out before the next has rotated in far
        // enough to start appearing. A wider fade band can guarantee
        // that on its own, but only by starting the fade much earlier
        // (a wide, gradual fade through the middle of the strip, which
        // read as worse). Denser panels let the fade band stay narrow
        // and close to the edge while still always having a panel in
        // it. Trade-off: a slightly gentler curve (larger radius) than
        // the 14-panel version — worth it for a gap-free loop.

        // One flip-reveal image per unique card, shown on hover. Sourced
        // from the uploaded images that weren't already used as one of
        // the 7 front faces above (6 of the 13 originally-uploaded SVGs
        // were unused — cards 1-6 each got a unique one, and card 7
        // reuses the sky-clouds image since only 6 unique "extra"
        // images were available for 7 cards).
        const flipSources = [
          "assets/flip-card-1.png",
          "assets/flip-card-2.png",
          "assets/flip-card-3.png",
          "assets/flip-card-4.png",
          "assets/flip-card-5.png",
          "assets/flip-card-6.png",
          "assets/flip-card-7.png",
        ];
        const repeatedSources = [...imageSources, ...imageSources, ...imageSources];
        const panelCount = repeatedSources.length;
        const angleStep = (Math.PI * 2) / panelCount;
        const autoplaySpeed = (Math.PI * 2) / 40; // one full turn per 40s — a touch slower than the reference's 32s default
        let frameId = 0;
        let rotation = 0;
        let velocity = 0;
        let lastTime = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartRotation = 0;
        let previousX = 0;
        let previousMoveTime = 0;
        let panels = [];
        // The card currently flipped open via hover, if any. Forced to
        // full opacity/top z-index in updateCarousel, and freezes
        // autoplay (see render()) so it doesn't rotate away mid-look.
        let activeHoverCard = null;
        const hoverCapable = window.matchMedia("(hover: hover) and (pointer: fine)");

        function setActiveHoverCard(card) {
          if (activeHoverCard === card) return;
          if (activeHoverCard) activeHoverCard.classList.remove("is-active-hover");
          activeHoverCard = card;
          if (card) card.classList.add("is-active-hover");
          baseSet.classList.toggle("is-card-hovered", Boolean(card));
        }

        function resetToStatic() {
          cancelAnimationFrame(frameId);
          frameId = 0;
          rotation = 0;
          velocity = 0;
          lastTime = 0;
          isDragging = false;
          setActiveHoverCard(null);
          imageStage.classList.remove("is-carousel", "is-cylinder-carousel", "is-dragging");
          baseSet.style.transform = "";
          baseSet.style.opacity = "";
          baseSet.innerHTML = staticMarkup;
          panels = [];
        }

        function buildCarousel() {
          resetToStatic();
          carousel = null;
          if (reduceMotion.matches) return;

          const fragment = document.createDocumentFragment();
          baseSet.style.setProperty("--n", panelCount);
          baseSet.style.setProperty("--ba", `${360 / panelCount}deg`);

          // r = (0.5w + 0.5em) / tan(halfAngle) — same formula the
          // reference component uses, so panels tile edge-to-edge with
          // no gaps or overlap regardless of card count/width.
          const cardWidth = parseFloat(getComputedStyle(baseSet).getPropertyValue("--w")) || 214;
          const halfAngle = Math.PI / panelCount;
          const radius = (0.5 * cardWidth + 8) / Math.tan(halfAngle);
          baseSet.style.setProperty("--r", `${radius}px`);

          repeatedSources.forEach((source, index) => {
            const card = document.createElement("div");
            card.className = "hero-card cylinder-card";
            card.style.setProperty("--i", index);
            card.dataset.angle = (index * angleStep).toString();

            // Front/back flip structure: two faces, back rotated 180°
            // and backface-hidden, so a rotateY(180deg) on .card-flip
            // swaps which one is showing. Nested inside the panel's own
            // ring-position transform, which never changes here — only
            // .card-flip's transform moves, on hover.
            const flip = document.createElement("div");
            flip.className = "card-flip";

            const front = document.createElement("div");
            front.className = "card-face card-face-front";
            const frontImg = document.createElement("img");
            frontImg.src = source;
            frontImg.alt = "";
            front.appendChild(frontImg);

            const back = document.createElement("div");
            back.className = "card-face card-face-back";
            const backImg = document.createElement("img");
            backImg.src = flipSources[index % imageSources.length];
            backImg.alt = "";
            back.appendChild(backImg);

            flip.appendChild(front);
            flip.appendChild(back);
            card.appendChild(flip);
            fragment.appendChild(card);
          });

          baseSet.innerHTML = "";
          baseSet.appendChild(fragment);
          panels = Array.from(baseSet.querySelectorAll(".cylinder-card"));
          imageStage.classList.add("is-carousel", "is-cylinder-carousel");

          // Fade the ring in rather than having it pop in fully-formed.
          baseSet.style.opacity = "0";
          updateCarousel();
          requestAnimationFrame(() => {
            baseSet.style.opacity = "1";
          });
          frameId = requestAnimationFrame(render);

          carousel = {
            boost(amount) {
              velocity += amount;
            },
          };
        }

        function normalizedAngle(angle) {
          return Math.atan2(Math.sin(angle), Math.cos(angle));
        }

        // Below this much "frontness" (cos of the panel's angle from
        // dead-center) a panel starts fading out; it hits 0 opacity at
        // FADE_OUT. Fading by the panel's own angle (rather than a
        // screen-space mask) is what keeps the edge consistent
        // regardless of rotation phase, panel width, or screen position.
        //
        // Fade band width must exceed the angle between panels
        // (360°/21 ≈ 17.1°) or there will be moments where zero panels
        // sit inside the band — that's the empty-gap-at-the-edge bug.
        // FADE_IN=0.45 (~63.3°) to FADE_OUT=0.05 (~87.1°) is a ~23.8°
        // band, comfortably wider than the 17.1° panel spacing, so
        // there's always at least one panel actively fading — while
        // still keeping cards fully opaque until fairly late and fully
        // gone very close to the true edge (87°+).
        const FADE_IN = 0.45;
        const FADE_OUT = 0.05;

        function updateCarousel() {
          baseSet.style.transform = `translateZ(var(--r)) rotateY(${rotation}rad)`;

          for (const panel of panels) {
            // The flipped-open card stays fully visible and on top
            // regardless of where it currently sits in the ring —
            // otherwise hovering a card near the edge would show its
            // flip mid-fade, or another card could render in front of
            // it while it's the thing you're looking at.
            if (panel === activeHoverCard) {
              panel.style.opacity = "1";
              panel.style.zIndex = "9999";
              continue;
            }
            const panelAngle = normalizedAngle(Number(panel.dataset.angle) + rotation);
            const frontness = Math.max(0, Math.cos(panelAngle));
            const fade = Math.min(1, Math.max(0, (frontness - FADE_OUT) / (FADE_IN - FADE_OUT)));
            panel.style.opacity = fade.toFixed(3);
            panel.style.zIndex = Math.round(frontness * 1000).toString();
          }
        }

        // Drag sensitivity: radians of rotation per pixel of horizontal
        // pointer movement. Raised from the original value so a normal
        // drag reads as a clear, direct 1:1-feeling spin.
        const DRAG_SENSITIVITY = 0.012;
        // Passive cursor-follow: even without clicking, the ring leans
        // toward whichever side of the hero the cursor is on. This is a
        // continuous velocity bias (spring-like, per Emil Kowalski's
        // guidance on not tying motion directly/instantly to raw mouse
        // position), not a hard 1:1 tracking — it fades back to plain
        // autoplay as the cursor moves toward center or leaves.
        //
        // Kept well under autoplaySpeed on purpose: this used to be
        // strong enough to cancel autoplay out entirely (or reverse it)
        // whenever the cursor simply rested on one side of the hero —
        // the carousel would visibly stall, reading as "the scroll has
        // an end" rather than a continuous loop. This only modulates
        // speed within a range that always keeps rotating forward.
        const HOVER_BIAS_STRENGTH = autoplaySpeed * 0.45;
        let hoverBiasTarget = 0;

        function handlePointerDown(event) {
          if (reduceMotion.matches) return;
          isDragging = true;
          velocity = 0;
          dragStartX = event.clientX;
          dragStartRotation = rotation;
          previousX = event.clientX;
          previousMoveTime = performance.now();
          imageStage.classList.add("is-dragging");
          imageStage.setPointerCapture?.(event.pointerId);
        }

        function handlePointerMove(event) {
          if (isDragging) {
            const now = performance.now();
            const deltaX = event.clientX - previousX;
            const elapsed = Math.max(16, now - previousMoveTime);
            // Increasing rotation spins the ring's visible face to the
            // left (per the rotateY/translateZ math), so a leftward drag
            // (negative deltaX) must INCREASE rotation — hence the
            // negated sign here. Getting this backwards is exactly what
            // makes a drag carousel feel like it's fighting the cursor.
            rotation = dragStartRotation - (event.clientX - dragStartX) * DRAG_SENSITIVITY;
            velocity = -(deltaX * DRAG_SENSITIVITY) / (elapsed / 1000);
            previousX = event.clientX;
            previousMoveTime = now;
            updateCarousel();
            return;
          }

          if (reduceMotion.matches) return;
          const rect = imageStage.getBoundingClientRect();
          if (rect.width === 0) return;
          // -1 at the stage's left edge, 0 at center, +1 at the right edge.
          const offset = ((event.clientX - rect.left) / rect.width - 0.5) * 2;
          // Negated for the same reason as the drag mapping above: cursor
          // on the right should make the ring lean right, which means
          // slowing/reversing rotation's growth, not speeding it up.
          hoverBiasTarget = -Math.max(-1, Math.min(1, offset)) * HOVER_BIAS_STRENGTH;
        }

        function handlePointerUp(event) {
          if (!isDragging) return;
          isDragging = false;
          imageStage.classList.remove("is-dragging");
          imageStage.releasePointerCapture?.(event.pointerId);
        }

        function handlePointerLeave() {
          hoverBiasTarget = 0;
        }

        function render(time) {
          if (!lastTime) lastTime = time;
          const delta = Math.min(64, time - lastTime);
          lastTime = time;

          // Freeze rotation while a card is flipped open on hover —
          // otherwise it'd rotate out from under the cursor mid-look,
          // fighting the very thing the hover was trying to show you.
          if (!isDragging && !activeHoverCard) {
            const dt = delta / 1000;
            // Note: no floor is applied here on top of the hover-bias
            // cap above — released-drag velocity is allowed to briefly
            // spin the ring backward (that's the point of drag momentum),
            // it just decays back to normal autoplay via friction below.
            rotation += (autoplaySpeed + velocity + hoverBiasTarget) * dt;
            velocity *= Math.pow(0.92, delta / 16.67);
            if (Math.abs(velocity) < 0.002) velocity = 0;
            updateCarousel();
          } else if (activeHoverCard) {
            // Rotation is frozen, but opacity/z-index still needs a
            // pass so the hovered card's forced full-opacity/top-layer
            // state (and the rest fading normally) actually applies.
            updateCarousel();
          }

          frameId = requestAnimationFrame(render);
        }

        function handleCardMouseOver(event) {
          if (!hoverCapable.matches || isDragging) return;
          const card = event.target.closest(".cylinder-card");
          if (!card) return;
          setActiveHoverCard(card);
        }

        function handleCardMouseOut(event) {
          const card = event.target.closest(".cylinder-card");
          if (!card || card !== activeHoverCard) return;
          // Ignore moves between elements still inside the same card
          // (e.g. onto its front/back face) — only clear on a real exit.
          if (card.contains(event.relatedTarget)) return;
          setActiveHoverCard(null);
        }

        imageStage.addEventListener("pointerdown", handlePointerDown);
        imageStage.addEventListener("pointermove", handlePointerMove);
        imageStage.addEventListener("pointerup", handlePointerUp);
        imageStage.addEventListener("pointercancel", handlePointerUp);
        imageStage.addEventListener("pointerleave", handlePointerLeave);
        imageStage.addEventListener("mouseover", handleCardMouseOver);
        imageStage.addEventListener("mouseout", handleCardMouseOut);
        reduceMotion.addEventListener("change", buildCarousel);
        buildCarousel();
      }

      setupCardCarousel();

      // "Generate Cards" — when the carousel is spinning, give it a
      // satisfying kick rather than trying to swap images mid-rotation.
      // Only falls back to reshuffling static cards in the (rare)
      // reduced-motion case, where the carousel never builds at all.
      let isBusy = false;

      function generateCards() {
        if (isBusy) return;

        if (carousel) {
          isBusy = true;
          ctaButton.disabled = true;
          carousel.boost(6);
          window.setTimeout(() => {
            isBusy = false;
            ctaButton.disabled = false;
          }, 220);
          return;
        }

        // Only reachable when the carousel never built, which only
        // happens under prefers-reduced-motion — so an instant swap
        // (no transition, no timers) is the correct behavior here, not
        // an oversight.
        const cards = Array.from(document.querySelectorAll(".hero-card"));
        if (!cards.length) return;

        const sources = cards.map((card) => card.querySelector("img").getAttribute("src"));
        let shuffled = shuffle(sources);
        if (shuffled.every((src, i) => src === sources[i])) {
          shuffled = shuffle(sources);
        }

        cards.forEach((card, i) => card.querySelector("img").setAttribute("src", shuffled[i]));
      }

      ctaButton.addEventListener("click", generateCards);
    </script>
  </body>
</html>
